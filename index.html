<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supplier & Delivery Details</title>
  </head>

  <body>
    <form action="" method="post">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px">
        <!-- Supplier Details -->
        <div>
          <h3>Supplier Details</h3>

          <div>
            <div>
              <label for="supplierName">Supplier Name</label>
              <select name="supplierName" id="supplierName" required>
                <option value="" selected disabled hidden>Select Option</option>
              </select>
            </div>

            <div>
              <label for="supplierAddress">Supplier Address</label>
              <input
                type="text"
                id="supplierAddress"
                name="supplierAddress"
                required
              />
            </div>

            <div>
              <label for="supplierMerchendiser">Supplier Merchendiser</label>
              <input
                type="text"
                id="supplierMerchendiser"
                name="supplierMerchendiser"
                required
              />
            </div>

            <div>
              <label for="supplierContact">Supplier Contact</label>
              <input
                type="tel"
                id="supplierContact"
                name="supplierContact"
                required
              />
            </div>
          </div>
        </div>

        <!-- Delivery Details -->
        <div>
          <h3>Delivery Details</h3>

          <div>
            <div>
              <label for="companyName">Company Name</label>
              <select name="companyName" id="companyName" required>
                <option value="" selected disabled hidden>Select Option</option>
              </select>
            </div>

            <div>
              <label for="shippingAddress">Shipping Address</label>
              <select id="shippingAddress" name="shippingAddress" required>
                <option value="" selected disabled hidden>Select Option</option>
              </select>
            </div>

            <div>
              <label for="shippingMerchendiser">Merchandiser Name</label>
              <select
                id="shippingMerchendiser"
                name="shippingMerchendiser"
                required
              >
                <option value="" selected disabled hidden>Select Option</option>
              </select>
            </div>

            <div>
              <label for="shippingContact">Contact</label>
              <input
                type="tel"
                id="shippingContact"
                name="shippingContact"
                required
              />
            </div>
          </div>
        </div>
      </div>
      <button type="submit">Submit</button>
    </form>

    <script
      type="module"
      src="./js/supplierAddress/supplierAddress.js"
    ></script>

    <script
      type="module"
      src="./js/deliveryAddress/deliveryAddress.js"
    ></script>
  </body>
</html>
